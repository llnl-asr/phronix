# phronix tuning overrides for this layer.
# Only the keys set here differ from the shipped defaults;
# everything else falls through. See `phronix tuning`.
graph: {}
learning:
  workers: 8
  batch: 1
  notice_seconds: 5.0
research:
  budget_scale: 1.0
  # No whole-pipeline target. Stage budgets are the numbers themselves.
  #
  # A total was tried: it made each stage's budget depend on how the earlier
  # ones behaved, so `propose` was set to 60s and ran with 10s. The stage that
  # overspends is the stage that gets cut, and nothing else is disturbed.
  # No stage shorter than this. A stage that cannot make one tool call is not
  # fast, it is a stage that always finalises.
  min_stage_s: 15
  # The budget is the deadline now, not a suggestion.
  #
  # 8x made the budget decorative. 1.0 makes it the deadline: the stage is
  # stopped when its time is up, its findings are filed by the finalize pass,
  # and the pipeline moves to the next phase.
  hard_timeout_multiple: 1.0
  # Give time where the task turns out to be hard.
  #
  # Each try gets half again as long as the one before: try 1 10 min, try 2
  # 15, try 3 22. A task solved on the first pass never pays for this.
  retry_budget_multiple: 1.5
  # And again when the SAME failure signature comes back twice — that is not a
  # slow task, it is a task whose reading of the problem is wrong.
  stuck_budget_multiple: 1.5
  # The stuck time goes to the stage that reads the failure, not spread thin.
  stuck_diagnose_multiple: 2.0
llm:
  max_concurrent_agents: 128
  # Zero on the local fleet.
  #
  # This spacing exists to protect a metered Anthropic allocation from being
  # burned in minutes by a wide fanout. The local cluster has no allocation to
  # protect and 32 backends to fill, so the same 1.5s is pure serialisation:
  # a research pass that fans out to 8 aspects paid 12s of dead time before the
  # last one even started, every stage, every task.
  #
  # Put it back to 1.5 for `--provider anthropic`.
  min_seconds_between_starts: 0.0
