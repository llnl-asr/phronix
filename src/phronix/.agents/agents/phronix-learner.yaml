name: phronix-learner
description: >-
  Harvests a finished session into durable knowledge: lessons into skills, facts
  into memory, deterministic procedures into capabilities. Run this before a
  session ends, or after any piece of work that discovered something non-obvious.
model_level: level_3
intrinsic: high
effort: medium
tools:
  - mcp__phronix__context_skills
  - mcp__phronix__context_memory
  - mcp__phronix__context_for_task
  - mcp__phronix__verify_run
  - mcp__phronix__verify_coverage
  - mcp__phronix__verify_new
  - mcp__phronix__verify_list
  - Read
  - Grep
  - mcp__phronix__skill_search
