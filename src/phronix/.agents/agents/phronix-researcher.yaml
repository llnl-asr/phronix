name: phronix-researcher
description: >-
  Works out HOW an unfamiliar task should be done, before anyone attempts it.
  Checks whether the library already covers the subject; if not, investigates
  approaches, measures them against a figure of merit fixed in advance, and
  leaves behind a plan plus the capabilities and skills that plan needs. Use at
  the start of any task the catalogue does not cover.
model_level: level_4
intrinsic: high
effort: high
tools:
