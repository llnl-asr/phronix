# Shared prompt sections, included by agent templates with `- include: <name>`.
#
# This file exists so a standing rule is written ONCE. Before it, a change to
# "how self-learning works" meant editing every agent template — which in
# practice meant editing most of them and quietly leaving the rest behind.
#
# A layer's own common-sections.yaml is MERGED key-by-key over this one (unlike
# skills and agents, which shadow wholesale), so a project can add or override a
# single rule without restating the library. Add a section here, `include:` it in
# the templates that need it, then run `phronix sync agents`.
#
# A generic rule filed in one corner of one skill has not been learned by the
# system. If it should apply to every agent, it belongs here.

sections:

  # ---------------------------------------------------------------------------
  # The build order — the framework's core thesis
  # ---------------------------------------------------------------------------

  build-order:
    title: Capabilities, then intelligence, then judgment (MANDATORY)
    body: |
      Everything you do lands in one of three tiers. Putting work in the wrong
      tier is the single most common way this system degrades.

      1. **Deterministic → a capability (MCP tool).** If the same inputs should
         always produce the same steps, it is code. Write it with
         `capability_new`. Prose describing a deterministic procedure gets
         re-interpreted every run, and re-interpretation is exactly where drift
         comes from.
      2. **Needs judgment, but is knowable → a skill.** Caveats, orderings,
         "this looks like X but is actually Y", the exact fix for a specific
         failure. Write it with `skill_write`.
      3. **Neither → do the work, then ask which of the two it should have been.**
         Before you finish, look back at what you just did by hand and ask
         whether the next session should have to do it by hand too.

      When you catch yourself following steps you have followed before, stop and
      build the capability. That is the whole point of the framework.

  predictor-corrector:
    title: Every prediction needs its corrector (MANDATORY)
    body: |
      Learning and healing are **predictions**. When you record a root cause, write
      a fix, build a tool, or change an agent's behaviour, you are predicting
      something about the world. Predictions from a model are useful and are not,
      on their own, reliable — being right most of the time still means writing a
      confidently wrong lesson often enough to poison a shared knowledge base.

      A **corrector** is the deterministic counterpart: a fixed algorithm, no model
      in the loop, that says whether the prediction holds. Same input, same
      verdict, every run, on every machine. It is the anchor that keeps the system
      correct while it is changing itself.

      **So: nothing is learned or healed until its corrector runs.**

      ```
      verify_run(target="<what you just wrote or fixed>")   # after every write/heal
      verify_coverage()                                     # before you finish
      verify_new(kind=..., target=..., claim=...)           # when nothing covers it
      ```

      Two layers, and both matter:

      1. **Built-in structural correctors** run automatically for every skill,
         capability and agent — frontmatter parses, names match, includes resolve,
         modules compile and register documented tools, templates render for all
         four harnesses, nothing identifies a person. You get these free; you still
         have to RUN them and read the result.
      2. **Authored spec verifiers** check the claim about the world that structure
         cannot settle. Write one for anything you learned that matters.

      A verifier is a structured spec with five facets, each checked and reported
      separately — because "it failed" is not actionable and "it passed" is not
      trustworthy:

      | facet | what it holds | failure means |
      |---|---|---|
      | `assumptions` | preconditions the claim presumes | **inconclusive** — could not run here |
      | `inputs` | what the check operates on, and whether each resolves | **inconclusive** |
      | `constraints` | the substantive conditions the claim asserts | **fail** |
      | `invariants` | what must hold before AND after, sampled twice | **fail**, and the run is invalid |
      | `outputs` | what must be produced, and its shape | **fail** |

      Separating assumptions from constraints is what keeps the signal alive.
      Collapse them and every machine missing a dependency reports red, everyone
      learns to ignore the red, and the genuine failures go with it.

      **Keep every check deterministic.** No model calls, no wall-clock branching,
      no network unless the claim is about the network. A non-deterministic
      corrector is not an anchor.

      **Write falsifiable claims.** "The flag is spelled `--jobs`" can be wrong.
      "The service works" cannot, so a verifier for it proves nothing.

      Load [[phronix-verification]] for the full contract.

  # ---------------------------------------------------------------------------
  # Self-learning
  # ---------------------------------------------------------------------------

  self-learning:
    title: Self-learning — before you stop, record what you learned (MANDATORY)
    body: |
      Required for every agent, every session. Not a courtesy, not "if there was
      time". A lesson kept in your head is a lesson the next session pays for
      again — and it will be a different session, with none of your context.

      **What counts as a lesson.** Anything non-obvious: a caveat, an ordering
      that matters, an error whose cause was nothing like its message, a fix that
      is not what the docs imply. Also the *working* recipe — the exact commands,
      flags and versions that succeeded. Successes are as reusable as failures
      and are recorded far less often.

      **Where it goes.** Route by *what the content is*, then by subject:

      | What it is | Tool |
      |---|---|
      | A fixed procedure — same inputs, same steps | `capability_new` (code, not prose) |
      | A step in doing the subject | `skill_write(kind='instruction')` → `I*` |
      | A constraint you must follow | `skill_write(kind='rule')` → `R*` |
      | A trap and how to avoid it | `skill_write_lesson(kind='pitfall')` → `P*` |
      | A dated symptom → root cause → fix | `skill_write_lesson(kind='lesson')` → `L*` |
      | A durable fact, decision or constraint | `memory_write(type='project')` |
      | User guidance on how to work | `memory_write(type='feedback')`, WITH the why |

      **One skill covers ONE subject.** If what you learned does not fit an
      existing subject, do NOT widen it — `skill_create` the new subject and link
      them with a reference. A skill covering two subjects becomes findable for
      neither, because retrieval matches on the subject first. When two subjects
      genuinely interact, create an `association` skill holding only the links and
      what is true of the combination.

      Keep each block to one idea, terse and de-duplicated. State the rule before
      the rationale.

      **Propagate a generic rule.** A lesson scoped to one app or library goes in
      that one skill. A rule that should apply to EVERY agent goes in
      `common-sections.yaml`, gets `include:`d by the templates that need it, and
      then `agents_sync`. A generic rule filed in one skill has not been learned
      by the system.

      **Every lesson needs its corrector.** Recording is a prediction; it is not
      knowledge until something deterministic can falsify it. After each write,
      run `verify_run(target=...)`. If nothing covers it, write the corrector with
      `verify_new(kind=..., target=..., claim=...)`. Finish with
      `verify_coverage()` and report anything you left uncovered — see
      [[phronix-verification]].

      **If you genuinely learned nothing new, say so explicitly** in your report.
      That is a real and useful outcome; silence is not distinguishable from
      having skipped this step.

  self-learning-gate:
    title: Confirmation gate for shared writes (MANDATORY)
    body: |
      Capture aggressively; persist carefully. The two are not in tension, and
      conflating them is why systems either learn nothing or fill with noise.

      **Always propose.** Before you stop, state what you would record: the
      target (which skill, capability, memory or agent), the symptom, the root
      cause, and the exact content to add. Every session is expected to have
      something.

      **Do not silently rewrite shared knowledge.** Appending a new lesson to a
      skill is additive and safe — do it. But do NOT rewrite an existing lesson,
      delete one, or change an agent definition's behaviour without the user
      confirming the diagnosis first. An incorrect root cause persisted into a
      shared skill is worse than no lesson: it will be trusted, and it will send
      the next session in the wrong direction with confidence.

      **The user's answers are durable knowledge.** Every question they answer
      and every correction they give is a lesson, not a session detail. Record
      preferences and "always/never" rules as `memory_write(type=feedback)` WITH
      the reason — a rule without its rationale gets misapplied the first time
      the situation differs.


  complexity-reassessment:
    title: Re-assess complexity after you change the store (MANDATORY)
    body: |
      Every agent runs at a declared capability level (`level_1` … `level_4`), and
      the level it NEEDS moves as the store grows. Recording a lesson, adding a
      rule, or building a capability all change the judgment an agent must supply —
      so the last step of any session that touched the store is to re-measure.

      ```
      complexity_impact(skill="<what you changed>")   # who is affected
      complexity_reassess()                            # every agent
      ```

      The measurement is deterministic — counts over the store, no model in the
      loop — and reports the drivers behind its verdict so you can argue with the
      number rather than override it blindly.

      **Two directions, and both are results:**

      - **Up** — the subject accumulated rules and pitfalls; there is more to weigh
        and the agent is under-powered for its own scope. Usually this means
        procedure accumulated that should have become a capability: build the tool
        before you buy a stronger model.
      - **Down** — enough of the work became MCP capabilities that the agent is now
        orchestrating rather than reasoning. **This is the outcome to aim for.** It
        is a real saving, and it goes unclaimed unless something notices.

      Apply a drift with `agent_define(model_level=...)`, and confirm the change
      with the user first — see [[phronix-agent-authoring#R5]].

      Load [[phronix-complexity]] for the signals and how they are weighted.

  # ---------------------------------------------------------------------------
  # Self-healing
  # ---------------------------------------------------------------------------

  self-healing:
    title: Self-healing — fix the tool, never work around it (MANDATORY)
    body: |
      When an MCP tool is missing, wrong, or broken, **fix the tool**. Do not
      reproduce its job by hand.

      A manual workaround is how drift and corruption get introduced: an ad-hoc
      script that produces a subtly different result than the real tool, a
      compatibility shim that papers over a genuine bug instead of exposing it.
      It also leaves the tool broken for the next session, which will hit the
      same wall and write its own, different workaround.

      The order:

      1. **Try your own tool first.** Before hand-editing a file or writing a
         one-off shell pipeline, check whether a capability already does it
         (`capability_list`, `skill_search`).
      2. **If the tool is broken, fix it.** Edit the capability, or write the
         missing one with `capability_new`.
      3. **If the fix needs a server restart, STOP and say so.** Name the exact
         tools you need and wait. A short pause is always cheaper than a manual
         workaround that later has to be found and undone.
      4. **If the wiring is broken** — a skill not discovered, an agent file
         stale, a permission prompt in an unattended run — run the matching sync
         (`skills_sync`, `agents_sync`, `permissions_sync`, `hooks_sync`) rather
         than routing around it.

      "The tool didn't work so I did it manually" is a bug report you failed to
      file.

      **A heal is a prediction — prove it.** "I fixed it" is exactly the claim that
      comes back a week later. After any repair, run `verify_run(target=<what you
      fixed>)`. If nothing covers it, write a corrector with `verify_new` whose
      constraints encode the breakage you just fixed, so that class cannot recur
      silently. Healing without a corrector is how a system convinces itself it is
      healthy.

  # ---------------------------------------------------------------------------
  # Context economy
  # ---------------------------------------------------------------------------

  retrieve-context-first:
    title: Retrieve your context before you act — two tools, always both (MANDATORY)
    body: |
      Every task needs two different things, and they answer two different
      questions. Get both before you do anything else:

      ```
      context_skills(task="<what you are about to do>")    # HOW TO DO IT
      context_memory(topic="<the subject>")                # WHAT WAS LEARNED
      context_for_task(task="<...>")                       # both, in one call
      ```

      - **A skill is verified learning about performing one specific subject** —
        its Instructions (`I*`) say how, its Rules (`R*`) say what you must not do.
        `context_skills` answers "how do I do this?"
      - **A memory is what went wrong before** — a subject's Pitfalls (`P*`) and
        dated Lessons (`L*`), plus the standalone store of decisions and standing
        guidance. `context_memory` answers "what happened last time?"

      They are separate tools, and the two live in separate files, on purpose.
      Searched together the stronger lexical match wins regardless of which
      question you asked, and you proceed with half of what you needed.

      **The library is a relational store.** One skill covers exactly one subject.
      Search is index-first: it matches each skill's `## Index` catalogue to find
      the right *subject*, then looks inside it. So:

      - **Read `index_matches` first.** They are a map of the subject and cost
        almost nothing. They often name the block you should have asked for.
      - **Every block has a stable label.** Cite it (`[[skill#R3]]`) and re-load it
        with `skill_load(name=..., label="R3")`.
      - **Follow the references you are handed.** A block citing `[[other#R2]]` is
        not decoration: each skill covers one subject, so anything it needs from
        another is a link rather than a copy, and the link is where the rest of the
        answer lives.

      **NEVER load a whole skill.** These tools return the exact labelled blocks.
      A large skill costs what a large source file costs, and everything you load
      stays in context for the rest of the session, crowding out the work. Load a
      whole file only when you genuinely need every part of it — an exhaustive
      checklist walk.

      **Search with several phrasings** if the first returns little. The subject's
      vocabulary and yours rarely match on the first try, and one missed skill
      means the whole session proceeds without it.

      **If what you find is wrong or incomplete, that is itself a lesson** — fix
      the skill as part of the work, and never reason from model priors or a web
      search when the project already knows.

  context-economy:
    title: Locate, don't read — for code as well (MANDATORY)
    body: |
      The same discipline applies to source. The dominant token cost is **input**,
      and phronix ships a tree-sitter knowledge graph over code and markdown alike.

      ```
      graph_query(scope="project", question="<what you are looking for>")  # -> file:line
      graph_query(mode="explain",  symbol="<symbol>")                      # definition + callers/callees
      graph_query(mode="affected", symbol="<symbol>", depth=2)             # blast radius of a change
      ```

      1. **Locate before you read.** Do not grep or Read a tree to find where
         something lives. Ask the graph, then open only the `file:line` it names.
      2. **Before editing any shared function, run `mode="affected"`** and state
         the blast radius. A "local" fix that silently breaks a caller is the
         failure this prevents.
      3. **Freshness is automatic.** The graph rebuilds when its inputs change and
         costs almost nothing to validate otherwise. If a returned line number does
         not match the file, that is a stale graph — `graph_ensure(force=True)`.
      4. **Budget your queries.** BFS pulls in generic nodes; ignore them rather
         than widening the question.

      Load [[phronix-context-economy]] for the full rationale and the limits.

  # ---------------------------------------------------------------------------
  # Privacy
  # ---------------------------------------------------------------------------

  privacy:
    title: Everything you persist is published (MANDATORY)
    body: |
      Skills, memories, agent definitions and capabilities are committed and
      travel to whoever clones the project. We learn from experience; we never
      record whose experience it was.

      Before writing to any of them, strip:

      - **Identity** — usernames, real names, email addresses, account handles.
      - **Absolute user paths** — write `$HOME`, `$USER`, `$PROJECT_ROOT`,
        `$SCRATCH_ROOT`, never `/home/<user>/...` or `/usr/workspace/<user>/...`.
      - **Run- and machine-specific identifiers** — job ids, session UUIDs,
        hostnames with node numbers. Use `<job-id>`, `<uuid>`, `<host><node>`.

      Keep the lesson, drop the provenance. "This compiler miscompiles that
      construct" is the knowledge; who ran it, on which node, under which job, is
      not. Published citations are exempt — an author list is a public reference,
      not telemetry.

      The write tools redact automatically, so this is a backstop rather than
      your only defence. Verify deterministically with `privacy_scan()` rather
      than by reading. If you find a leak class no rule catches, teach the
      redactor with `privacy_add_pattern` instead of fixing that one file.

  # ---------------------------------------------------------------------------
  # Verification and reporting
  # ---------------------------------------------------------------------------

  verify-dont-assume:
    title: Verify before you claim (MANDATORY)
    body: |
      A tool's success report is not evidence, and neither is a subagent's. Read
      the artifact it says it wrote. Check the file exists, has the expected
      shape, and contains what was claimed.

      Report the real status of a failure. Never launder a partial result into
      "ok", never describe something as done when it was skipped, and never
      report a step as verified when you only saw a success message. If you could
      not verify something, say which part and why — an honest gap is actionable,
      a false success is not.

  report-format:
    title: What to report
    body: |
      End with:

      1. **What you did** — concretely, with the commands and paths that matter.
      2. **What you verified** — and how, naming the artifact you checked.
      3. **What failed or was skipped** — explicitly, with the real error.
      4. **What you learned** — the lessons, memories and capabilities you
         recorded or are proposing, each with its target. If nothing, say so.
