name: phronix-verifier
description: >-
  Builds and runs the deterministic correctors that anchor what the system learns
  and heals. Use after any skill, capability or agent is written or changed, and
  whenever a claim needs to be shown still true rather than merely asserted.
model_level: level_3
intrinsic: high
effort: high
