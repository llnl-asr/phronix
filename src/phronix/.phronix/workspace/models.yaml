# The canonical model map.
#
# Agents declare a capability LEVEL, never a model id. That indirection is what
# lets one agent definition run on four harnesses, and makes a model upgrade a
# one-line edit here rather than a sweep through every template.
#
# This file is the menu. The live choice — which provider each harness is
# actually pointed at — lives in `active-models.json` in the write layer, written
# by `phronix configure-harness`. When the two disagree, active-models.json wins.
#
# Each harness reads exactly ONE provider column: the one named by its own
# `provider` key under `harness_mapping`. Do not read another harness's column;
# the model it names may not be served where you are calling from.

levels:
  level_1:
    purpose: deterministic orchestration and tool plumbing
    default: haiku
    providers:
      claude: claude-haiku-4-5-20251001
      openai: gpt-5-mini
      copilot: gpt-5-mini
      codex: gpt-5-codex-mini
      ollama: qwen3:8b
  level_2:
    purpose: routing, planning, and limited reasoning
    default: sonnet
    providers:
      claude: claude-sonnet-5
      openai: gpt-5
      copilot: gpt-5
      codex: gpt-5-codex
      ollama: qwen3:32b
  level_3:
    purpose: analysis, diagnosis, and stage-to-stage decisions
    default: sonnet
    providers:
      claude: claude-sonnet-5
      openai: gpt-5
      copilot: gpt-5
      codex: gpt-5-codex
      ollama: qwen3-coder:480b-cloud
  level_4:
    purpose: deep synthesis and cross-cutting reasoning
    default: opus
    providers:
      claude: claude-opus-5
      openai: gpt-5-pro
      copilot: gpt-5-pro
      codex: gpt-5-codex-pro
      ollama: deepseek-v3.2:cloud

# `provider:` here is the checked-in default per harness. The LIVE value is
# active-models.json -> harnesses -> <harness> -> provider.
#
# Note that claude is resolved to a model CLASS (haiku/sonnet/opus) rather than a
# pinned id when rendering agent files: Claude Code accepts class aliases, and
# using them keeps the rendered files stable across model releases instead of
# churning every agent file on each new id.
harness_mapping:
  claude:
    instructions: CLAUDE.md
    provider: claude
    config: .mcp.json
  opencode:
    instructions: AGENTS.md
    provider: ollama
    config: .opencode/opencode.jsonc
  copilot:
    instructions: .github/copilot-instructions.md
    provider: copilot
    config: .vscode/mcp.json
  codex:
    instructions: AGENTS.md
    provider: codex
    config: .codex/config.toml
