# phronix tuning: the numbers that decide how the framework behaves.
#
# Every value here was a constant in a source file, which made changing one a
# code edit and a reinstall. They are numbers rather than logic — thresholds,
# intervals, limits — and the right value for a laptop is not the right value
# for a 192-thread node, so they belong in a file the deployment can own.
#
# Layered like everything else phronix keeps: this file ships in the wheel,
# `~/.phronix/workspace/tuning.yaml` overrides it for a user, and
# `<repo>/.phronix/workspace/tuning.yaml` overrides both for a project. Only the
# keys you set need appear in an override; the rest fall through.
#
#   phronix tuning                     # what is in force, and where each came from
#   phronix tuning learning.notice_seconds
#   phronix tuning --set learning.notice_seconds=5
#   phronix tuning --set graph.refresh_seconds=30 --layer project
#
# A value nothing reads is a value that will drift from the behaviour it claims
# to describe, so each is named after the thing that reads it.

skills:
  # Characters a block may hold before it is REJECTED rather than truncated.
  #
  # A run once wrote a 12 KB skill whose correct fix sat as a sub-bullet inside
  # one instruction; three later attempts retrieved that skill and none acted on
  # it. The signal was present and its length destroyed it.
  block_limits:
    rule: 1000
    instruction: 1400
    reference: 1400
    lesson: 3000
    pitfall: 3000

  # How much of a query's discriminating power a match must account for.
  #
  # Weighted by inverse document frequency, so a term appearing in most skills
  # counts for little. At zero every query matches everything; measured,
  # irrelevant domain queries land at 0.14-0.17 and genuinely relevant ones at
  # 0.62-1.00, so the gap is wide and 0.30 sits in it.
  min_term_coverage: 0.30

graph:
  # How often a running MCP server rebuilds the knowledge graph.
  #
  # Measured: a warm query is 1.2s and one that must rebuild first is 6.0s. The
  # store is written constantly, so on the query path nearly every call paid the
  # rebuild — moving it to a clock means retrieval is warm by the time anyone
  # asks. A minute is short enough that a lesson written by the learner is
  # findable while the work that prompted it is still going on.
  refresh_seconds: 60.0

  # Whether a running server also picks up newly written capabilities.
  #
  # A capability is not live until its tool is registered, and registration
  # happened once at startup — so a tool written by the learner was invisible to
  # every server already running, which with concurrent tasks is most of them.
  refresh_capabilities: true

research:
  # Cases a corpus needs before a metric over it means anything.
  #
  # Below this the metric moves in visible steps and tuning is guessing which
  # step it landed on. Twenty is what the code shipped with — raise it where a
  # corpus is cheap to generate and the metric needs finer resolution.
  min_corpus_instances: 20

  # How the corpus is divided. Tuning happens on train and validate; only test
  # falsifies, and it is not run until the tuning is finished.
  split:
    train: 0.6
    validate: 0.2
    test: 0.2

  # How many times one line of thinking may be refined before it is abandoned.
  #
  # An agent that can always say "nearly right, one more tweak" will spend every
  # retry on its first idea. Two revisions covers "right place, missed a case";
  # a third means the diagnosis itself is wrong.
  max_refinements: 2

  # Multiplier on every research stage budget.
  #
  # The budgets are measured against a model decoding ~1000 tok/s. A slower
  # endpoint needs them scaled or every stage is cut off mid-investigation and
  # the run is scored as though the research happened: a local 150 tok/s model
  # truncated all six survey stages in a six-task run, at 300-400s against a
  # 180s budget.
  #
  # Scale by the ratio of decode rates. 1000/150 is about 6; 5 leaves the
  # slowest stages bounded rather than open-ended.
  #
  # THIS VALUE IS THE FALLBACK, not the usual path. `--budget-scale` defaults
  # to `auto`, which reads the fleet's own /metrics and derives the ratio, so
  # the number does not have to be re-derived by hand for every machine — and
  # is not silently wrong when a run moves to a slower one. Measured: corona's
  # MI50 fleet decodes ~34 tok/s, giving x30, where this file said x1 and every
  # planning agent was killed mid-investigation.
  #
  # Set it here only to pin a scale for a run whose point is comparability with
  # an earlier one, where a measurement that drifts would be the wrong input.
  budget_scale: 1.0

  # The scale used when there is no fleet to measure — i.e. a hosted endpoint.
  #
  # Below 1.0 because hosted is not the calibration, it is FASTER than it. The
  # budgets were measured against a local model at ~1000 tok/s; a Claude cloud
  # model turns a stage's tool calls around in seconds, so the same budget buys
  # several times the work. Measured on the Haiku run: `plan` spent its full
  # five minutes and its re-ask another five, on a task whose attempt stage had
  # finished in three.
  #
  # Lower it further for a model faster still; raise it toward 1.0 if stages
  # start reporting they ran out mid-investigation.
  hosted_budget_scale: 0.5

  # How far past its budget a stage may run before it is killed.
  #
  # The budget is a notification, not a deadline: killing at it threw away work
  # that was still progressing, and research continued on partial findings while
  # being scored as though it had not. The hard ceiling is what stops a wedged
  # agent holding a task forever, so it is set where it means "this is broken"
  # rather than "this is slow".
  hard_timeout_multiple: 8

  # How many ranked approaches get their own solution skill.
  #
  # Research ranks approaches against a figure of merit measured on a corpus it
  # built itself — a proxy. The top-ranked one is the most promising, not the
  # correct one, and until now it was the only one ever attempted. Writing a
  # skill per candidate is what lets several be tried against the task's own
  # tests, which is the only judge that settles it.
  #
  # 1 keeps the old behaviour. Above that costs one agent per extra candidate at
  # write-up time and one container per candidate at trial time.
  solution_candidates: 1

  # Aspects a plan must produce before the investigation is worth running.
  # Below this the fan-out has nothing to spread across.
  # Three ideas, and the plan stage does not finish with fewer.
  #
  # The pipeline explores exactly what the plan records, so a plan with two
  # ideas is a pipeline that explores two — measured live as `2 idea(s) at
  # once`, with the third never asked for. The solution is built from the
  # ideas, so a missing idea is a direction it never considers.
  min_aspects: 3

  # Times to ask a planner again before salvaging its prose or falling back to
  # generic angles. Each retry is a full agent invocation, traded against the
  # investigation phase existing at all.
  # Generous, because each retry gets the FULL plan budget rather than a
  # slice. Asking again is the cheapest corrector there is, and falling back to
  # generic angles should be the last resort rather than the second one.
  # More time each time a stage is sent back. A round that produced too few
  # ideas, or a finding with a hole in it, has shown the previous budget was
  # not enough for what it was asked.
  round_budget_multiple: 1.5
  max_explore_rounds: 2
  # Three flat rounds and the plan is accepted as it stands: if there is no
  # good third idea, exploring two real ones beats three more rounds of asking.
  max_plan_stalls: 3
  max_plan_retries: 5

  # How many times the validator may be asked within one plan phase.
  #
  # It has no budget of its own, on the reasoning that judging a list is
  # bounded by the list. True per call, false in aggregate: measured on
  # django-13551, `validate-ideas` ran 83 times on a single task, which is
  # where that task's wall-clock went.
  max_judgements: 8

  # How long the plan may keep looking for MORE steps once the floor is met.
  #
  # `min_aspects` is a floor, not a target, and past it the search is
  # opportunistic — but unbounded it does not behave that way. Measured on
  # django-13551: eight good steps kept, three more requested, still asking
  # twenty-five minutes into a task the bare arm had finished twice. Nothing
  # was failing; the loop simply had no reason to stop.
  #
  # When this runs out the pass finalises with what it has and continues.
  # Scaled by `budget_scale` like every other research clock, so a slow
  # endpoint gets proportionally longer rather than being cut off mid-idea.
  extra_ideas_seconds: 240

  # Extra attempts a task may earn by failing DIFFERENTLY each time.
  #
  # A failure that keeps changing is a task still converging, and cutting it off
  # at the ceiling throws away the attempt most likely to land. Bounded, because
  # "it changed again" can go on forever and a task needing six distinct wrong
  # answers is not close.
  extra_tries_when_moving: 2

  # Characters of diff an approach may carry as evidence. Larger than this is a
  # working tree with debris in it rather than a fix.
  change_limit: 4000

learning:
  # How often the learner looks at what has been reported.
  #
  # Ten seconds, because looking is arithmetic — observations are grouped by
  # shape, which costs nothing. Generalising is the expensive half and runs on
  # its own clock below.
  notice_seconds: 10.0

  # How often it turns what repeated into lessons and tools.
  #
  # A minute, because this half is an agent invocation and one of those costs
  # the better part of a minute before it does anything. Aggressive capture,
  # periodic compaction.
  reconcile_seconds: 60.0

  # Observations that make a cycle worth spending.
  #
  # One, because everything is learned. Waiting for a shape to repeat was wrong
  # in the direction that costs most: a finding reported once and never written
  # down is rediscovered at full price by the next task, while the block that
  # would have prevented it costs a few lines. Repetition does not make a
  # finding true — it makes it confident — so it belongs in how a block is
  # updated, not in whether one gets written.
  #
  # Raise it only to trade recall for spend on a very chatty run.
  batch: 1

  # Seconds a reconcile cycle may take. Off the critical path, so this buys
  # thoroughness rather than costing wall clock — bounded because a wedged
  # learner holding a skill file open is a problem for everyone.
  budget_seconds: 300

  # Reconcilers running at once, each holding a disjoint set of subjects.
  #
  # More is safe only because the split is by kind of operation: two workers
  # never write the same skill, so "more workers" cannot become "two lessons
  # that contradict each other in one file".
  workers: 3

llm:
  # Agent invocations allowed to be in flight at once, across the whole job.
  #
  # Set this ABOVE the number of agents a run will actually have in flight
  # whenever the endpoint schedules and reports its own queue. A self-hosted
  # llama.cpp server publishes `requests_deferred`, so letting it queue keeps
  # the backlog visible in `status.sh`; capping below the concurrency moves the
  # same queue into this process, where it shows up as nothing at all. Measured:
  # a cap of 8 against six tasks in two arms left two tasks silent for fourteen
  # minutes while the server had five idle slots.
  #
  # The binding limit is not the machine, it is the account: a five-hour usage
  # window that, once rejected, fails every agent instantly for the rest of it.
  # Measured: six tasks x four stage agents plus learner workers emptied the
  # window in under an hour, and the run then spent forty minutes producing
  # transcripts containing nothing but `rate_limit_event`.
  #
  # This is a whole-job gate, not a per-task one — tasks run concurrently, so a
  # per-task cap multiplies by however many are packed onto the node.
  max_concurrent_agents: 8

  # Seconds between starting one agent and starting the next.
  #
  # Concurrency alone bounds the peak but not the rate: eight agents that each
  # finish in twenty seconds still start a hundred and forty an hour. Spacing
  # the starts is what turns a burst into a sustainable draw on the window.
  min_seconds_between_starts: 2.0

  # What to do when the window is rejected outright.
  #
  # The stream says exactly when it resets, so waiting is a known quantity
  # rather than a guess. Waiting beats failing: every stage launched during a
  # rejected window returns nothing, at no saving, and the run reports a
  # research pipeline that collapsed rather than an account that ran dry.
  wait_for_reset: true

  # The working context an agent is given, whatever the server offers.
  #
  # Two ceilings exist and the tighter one wins. The SERVER's is hard: `-c` is
  # divided by `--parallel`, so a request over the per-slot window ends with
  # "reason": "length" mid-sentence and the task fails as "agent produced no
  # patch". This one is ours, and it is about quality and speed:
  #
  #   * conversations that reached 155,548 tokens produced worse results;
  #   * decode collapses as context grows — measured on one fleet at one moment,
  #     96,900 tokens gave 107 tok/s, 104,724 gave 42, and 113,055 gave 25.
  #
  # A `limits.context` in the cluster's own config overrides this, for a
  # deployment that knows better than either default.
  context_cap: 65536

  # Most tokens an agent may generate in one call.
  output_cap: 32000

  # Slots one task unit occupies on average.
  #
  # A unit is one task in one arm, and it is NOT asking the model continuously —
  # it checks out repos, runs tests and evaluates patches in between. Sampled
  # five times against a live 12-unit run: 2, 9, 8, 7, 6 requests in flight,
  # mean 6.4. This is what makes "how many tasks fill the fleet" answerable:
  # capacity / (duty_cycle x arms), not capacity / 1.
  duty_cycle: 0.53

  # Concurrent tasks one node can hold, whatever the fleet could serve.
  #
  # Each task is a container: cores for its test runs, and about two kernel
  # session keys against a per-user quota of 200. This binds long before the
  # GPUs do, and exceeding it fails as "unable to join session keyring: disk
  # quota exceeded", which names neither containers nor keys.
  max_tasks_per_node: 16

  # Longest single wait, in seconds. A five-hour window can be nearly that far
  # from resetting, and a job that silently sits for hours is worse than one
  # that stops and says why.
  max_wait_seconds: 1800

bus:
  # Milliseconds a producer will wait for the socket.
  #
  # Effectively zero: reporting is a side effect of doing the work, and a stage
  # that blocks on it has been made slower by the thing meant to make everything
  # faster. The file behind the bus is what makes dropping safe.
  send_timeout_ms: 50

  # Unsent messages a producer will hold before giving up on the socket.
  send_high_water_mark: 1000
